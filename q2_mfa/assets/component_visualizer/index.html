<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Component Analysis</title>
  <link rel="stylesheet" href="style.css">
  <script src="plotly-basic-2.35.2.min.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div>
        <p id="analysis-eyebrow" class="eyebrow">Component Analysis</p>
      </div>
    </header>

    <section class="control-panel" aria-label="Graph controls">
      <div class="control-group control-group-x-dimension">
        <label for="x-dimension">X-axis</label>
        <select id="x-dimension"></select>
      </div>

      <div class="control-group control-group-y-dimension">
        <label for="y-dimension">Y-axis</label>
        <select id="y-dimension"></select>
      </div>

      <div class="control-group control-group-color-by">
        <label for="color-by">Color by</label>
        <select id="color-by"></select>
      </div>

      <div class="control-group control-group-color-palette">
        <label for="color-palette">Color palette</label>
        <select id="color-palette"></select>
      </div>

      <div class="control-group control-group-size-by">
        <label for="size-by">Size by</label>
        <select id="size-by"></select>
      </div>

      <div class="control-group control-group-toggle control-group-barycenter">
        <span class="control-label-placeholder" aria-hidden="true">&nbsp;</span>
        <label class="toggle-option" for="show-barycenter">
          <input id="show-barycenter" type="checkbox">
          <span>Barycenter ellipse</span>
          <span class="help-tooltip" tabindex="0" role="button" aria-label="Barycenter ellipse help" data-tooltip="Shows an ellipse around the visible sample scores from the component-analysis sample coordinate table. The ellipse is calculated from the filtered samples on the selected X and Y axes: the center is the mean score and the shape comes from the two-dimensional covariance of those scores. Wider ellipses indicate more dispersion on the selected axes.">?</span>
        </label>
      </div>

      <div class="control-group control-group-top-features">
        <label for="top-feature-count">Number of features</label>
        <input id="top-feature-count" type="number" min="1" max="100" step="1" value="10">
      </div>

      <div class="control-group control-group-feature-scale">
        <label for="feature-scale">Feature scale</label>
        <input id="feature-scale" type="number" min="1" step="1" value="1">
      </div>

      <div class="control-group control-group-font-family">
        <label for="font-family">Font</label>
        <select id="font-family"></select>
      </div>

      <div class="control-group control-group-toggle control-group-full-feature-labels">
        <span class="control-label-placeholder" aria-hidden="true">&nbsp;</span>
        <label class="toggle-option" for="show-full-feature-labels">
          <input id="show-full-feature-labels" type="checkbox">
          <span>Full feature labels</span>
          <span class="help-tooltip" tabindex="0" role="button" aria-label="Full feature labels help" data-tooltip="Controls the text used for feature labels in the sample score plot. By default, long taxonomy-style feature names are shortened by splitting on semicolons, keeping the most specific non-empty rank, and removing common prefixes such as k__, p__, c__, o__, f__, g__, or s__. Turning this on uses the full feature name.">?</span>
        </label>
      </div>

      <div class="control-group control-group-toggle control-group-scale-circle">
        <span class="control-label-placeholder" aria-hidden="true">&nbsp;</span>
        <label class="toggle-option" for="show-feature-scale-circle">
          <input id="show-feature-scale-circle" type="checkbox">
          <span>Scale circle</span>
          <span class="help-tooltip" tabindex="0" role="button" aria-label="Scale circle help" data-tooltip="Draws a light grey circle centered at zero with radius equal to the current Feature scale. For correlations, it marks correlation magnitude 1 after scaling; for coordinates, it is only a visual scale reference.">?</span>
        </label>
      </div>

      <div class="control-group control-group-point-size">
        <label for="point-size-scale">Point size</label>
        <input id="point-size-scale" type="number" min="0.5" max="1.5" step="0.1" value="1">
      </div>

      <div class="control-group control-group-point-opacity">
        <label for="point-opacity">Point opacity</label>
        <input id="point-opacity" type="number" min="0.1" max="1" step="0.05" value="0.9">
      </div>

      <div class="control-group control-group-toggle control-group-point-border">
        <span class="control-label-placeholder" aria-hidden="true">&nbsp;</span>
        <label class="toggle-option" for="show-point-border">
          <input id="show-point-border" type="checkbox" checked>
          <span>Point border</span>
        </label>
      </div>

      <div class="control-group control-group-font-size">
        <label for="font-size">Font size</label>
        <input id="font-size" type="number" min="8" max="24" step="1" value="12">
      </div>

      <div class="control-group control-group-wide control-group-filters">
        <div id="filter-controls" class="filter-controls"></div>
      </div>
    </section>

    <section class="sample-plot-layout" aria-label="Sample score plot and details">
      <div class="plot-shell plot-shell-main">
        <div id="sample-plot" class="plot-canvas"></div>
      </div>
      <aside class="sample-details-panel" aria-label="Sample details">
        <div id="sample-details" class="sample-details">
          <div class="sample-details-empty">Click a sample to view details.</div>
        </div>
      </aside>
    </section>

    <section class="plot-grid-secondary">
      <div class="plot-shell plot-shell-secondary">
        <div class="plot-status">
          <span class="plot-title-with-help">Explained variance by component <span class="help-tooltip" tabindex="0" role="button" aria-label="Explained variance help" data-tooltip="Shows the percentage of variance values stored in the component-analysis percentage-of-variance result table. Larger bars indicate axes that capture more structure and are usually better candidates for interpretation.">?</span></span>
          <span id="variance-summary"></span>
        </div>
        <div id="variance-plot" class="plot-canvas plot-canvas-secondary"></div>
      </div>

      <div class="plot-shell plot-shell-secondary">
        <div class="plot-status">
          <span class="plot-title-with-help">Cumulative explained variance <span class="help-tooltip" tabindex="0" role="button" aria-label="Cumulative variance help" data-tooltip="Shows the cumulative percentage of variance values stored in the component-analysis cumulative-percentage-of-variance result table, which helps judge how many axes are needed to summarize the dataset.">?</span></span>
          <span id="cumulative-summary"></span>
        </div>
        <div id="cumulative-variance-plot" class="plot-canvas plot-canvas-secondary"></div>
      </div>

      <div class="plot-shell plot-shell-secondary mfa-only">
        <div class="plot-status">
          <span class="plot-title-with-help">Group coordinates (Partial inertia) <span class="help-tooltip" tabindex="0" role="button" aria-label="Group coordinates partial inertia help" data-tooltip="Shows group coordinates from the MFA group coordinate result table for the selected axes. Hover details add group contribution and cos2 values from the matching MFA result tables. Groups farther from zero are more influential in the displayed dimensions.">?</span></span>
        </div>
        <div id="group-plot" class="plot-canvas plot-canvas-secondary"></div>
      </div>

      <div class="plot-shell plot-shell-secondary mfa-only">
        <div class="plot-status">
          <span class="plot-title-with-help">Partial axes <span class="help-tooltip" tabindex="0" role="button" aria-label="Partial axes help" data-tooltip="Shows partial axis correlations from the MFA partial correlation result table. Each vector is a group's own principal axis (partial dim) projected onto the selected global MFA axes, so vectors pointing in similar directions indicate agreement between groups and vectors near zero are weakly aligned with this view.">?</span></span>
          <label class="partial-axes-count-control">Partial dims per group
            <input id="partial-axes-count" type="number" min="1" step="1" value="2">
          </label>
        </div>
        <div id="partial-axes-plot" class="plot-canvas plot-canvas-secondary"></div>
      </div>
    </section>

    <section class="feature-table-shell" aria-label="Data tables">
      <div class="plot-status">
        <label class="table-source-control">
          <select id="table-source" aria-label="Table"></select>
          <span class="help-tooltip" tabindex="0" role="button" aria-label="Table help" data-tooltip="Choose which component-analysis result table to show. Coordinate and correlation tables rank rows by plane magnitude, calculated as sqrt(x^2 + y^2) from the selected X and Y axis values. Contribution and cos2 tables instead show the sum of the two displayed dimensions; contributions are shown as percentages.">?</span>
        </label>
        <div class="feature-table-download-control">
          <button id="download-feature-table" class="feature-table-download" type="button">Download tsv</button>
          <span class="help-tooltip" tabindex="0" role="button" aria-label="Download tsv help" data-tooltip="Downloads only the table shown here: at most the top 100 rows for the selected X and Y axes. Coordinate and correlation tables include the calculated plane magnitude column (sqrt(x^2 + y^2)); contribution and cos2 tables include the sum of the two displayed dimensions (contributions as percentages). The downloaded values have less precision than the original data.">?</span>
        </div>
      </div>
      <div class="feature-table-wrapper">
        <table class="feature-table">
          <thead id="feature-table-head"></thead>
          <tbody id="top-features-table-body"></tbody>
        </table>
      </div>
      <div id="top-features-empty" class="feature-table-empty"></div>
      <div id="feature-name-tooltip" class="feature-name-tooltip" role="tooltip"></div>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
