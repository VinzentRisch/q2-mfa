<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MFA</title>
  <link rel="stylesheet" href="style.css">
  <script src="plotly-basic-2.35.2.min.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">MFA</p>
      </div>
    </header>

    <section class="control-panel" aria-label="Graph controls">
      <div class="control-group">
        <label for="x-dimension">X-axis</label>
        <select id="x-dimension"></select>
      </div>

      <div class="control-group">
        <label for="y-dimension">Y-axis</label>
        <select id="y-dimension"></select>
      </div>

      <div class="control-group">
        <label for="color-by">Color by</label>
        <select id="color-by"></select>
      </div>

      <div class="control-group">
        <label for="color-palette">Color palette</label>
        <select id="color-palette"></select>
      </div>

      <div class="control-group control-group-toggle control-group-barycenter">
        <span class="control-label-placeholder" aria-hidden="true">&nbsp;</span>
        <label class="toggle-option" for="show-barycenter">
          <input id="show-barycenter" type="checkbox">
          <span>Barycenter ellipse</span>
          <span class="help-tooltip" tabindex="0" role="button" aria-label="Barycenter ellipse help" data-tooltip="Shows an ellipse around the visible sample scores from ordination.txt. The ellipse is calculated from the filtered samples on the selected X and Y axes: the center is the mean score and the shape comes from the two-dimensional covariance of those scores. Wider ellipses indicate more dispersion on the selected MFA axes.">?</span>
        </label>
      </div>

      <div class="control-group control-group-top-features">
        <label for="top-feature-count">Number of features</label>
        <input id="top-feature-count" type="number" min="1" max="100" step="1" value="10">
      </div>

      <div class="control-group control-group-feature-scale">
        <label for="feature-scale">Feature scale</label>
        <input id="feature-scale" type="number" min="1" step="1" value="1">
      </div>

      <div class="control-group control-group-font-family">
        <label for="font-family">Font</label>
        <select id="font-family"></select>
      </div>

      <div class="control-group control-group-toggle control-group-full-feature-labels">
        <span class="control-label-placeholder" aria-hidden="true">&nbsp;</span>
        <label class="toggle-option" for="show-full-feature-labels">
          <input id="show-full-feature-labels" type="checkbox">
          <span>Full feature labels</span>
          <span class="help-tooltip" tabindex="0" role="button" aria-label="Full feature labels help" data-tooltip="Controls the text used for feature labels in the sample score plot. By default, long taxonomy-style feature names are shortened by splitting on semicolons, keeping the most specific non-empty rank, and removing common prefixes such as k__, p__, c__, o__, f__, g__, or s__. Turning this on uses the full feature name.">?</span>
        </label>
      </div>

      <div class="control-group control-group-toggle control-group-scale-circle">
        <span class="control-label-placeholder" aria-hidden="true">&nbsp;</span>
        <label class="toggle-option" for="show-feature-scale-circle">
          <input id="show-feature-scale-circle" type="checkbox">
          <span>Scale circle</span>
          <span class="help-tooltip" tabindex="0" role="button" aria-label="Scale circle help" data-tooltip="Draws a light grey circle centered at zero with radius equal to the current Feature scale. For correlations, it marks correlation magnitude 1 after scaling; for coordinates, it is only a visual scale reference.">?</span>
        </label>
      </div>

      <div class="control-group control-group-point-size">
        <label for="point-size-scale">Point size</label>
        <input id="point-size-scale" type="number" min="0.5" max="1.5" step="0.1" value="1">
      </div>

      <div class="control-group control-group-font-size">
        <label for="font-size">Font size</label>
        <input id="font-size" type="number" min="8" max="24" step="1" value="12">
      </div>

      <div class="control-group control-group-wide control-group-filters">
        <div id="filter-controls" class="filter-controls"></div>
      </div>
    </section>

    <section class="plot-shell plot-shell-main">
      <div id="sample-plot" class="plot-canvas"></div>
    </section>

    <section class="plot-grid-secondary">
      <div class="plot-shell plot-shell-secondary">
        <div class="plot-status">
          <span class="plot-title-with-help">Explained variance by component <span class="help-tooltip" tabindex="0" role="button" aria-label="Explained variance help" data-tooltip="Shows the proportion explained values stored in ordination.txt for each MFA component. Larger bars indicate axes that capture more structure and are usually better candidates for interpretation.">?</span></span>
          <span id="variance-summary"></span>
        </div>
        <div id="variance-plot" class="plot-canvas plot-canvas-secondary"></div>
      </div>

      <div class="plot-shell plot-shell-secondary">
        <div class="plot-status">
          <span class="plot-title-with-help">Cumulative explained variance <span class="help-tooltip" tabindex="0" role="button" aria-label="Cumulative variance help" data-tooltip="Shows the running total calculated from the component proportion explained values in ordination.txt. Each point sums that component and all earlier components, which helps judge how many axes are needed to summarize the dataset.">?</span></span>
          <span id="cumulative-summary"></span>
        </div>
        <div id="cumulative-variance-plot" class="plot-canvas plot-canvas-secondary"></div>
      </div>

      <div class="plot-shell plot-shell-secondary">
        <div class="plot-status">
          <span class="plot-title-with-help">Group coordinates (Partial inertia) <span class="help-tooltip" tabindex="0" role="button" aria-label="Group coordinates partial inertia help" data-tooltip="Shows group coordinates from group-coordinates.tsv for the selected MFA axes. Hover details add group contribution values from group-contributions.tsv and cos2 values from group-cosine-similarities.tsv. Groups farther from zero are more influential in the displayed dimensions.">?</span></span>
        </div>
        <div id="group-plot" class="plot-canvas plot-canvas-secondary"></div>
      </div>

      <div class="plot-shell plot-shell-secondary">
        <div class="plot-status">
          <span class="plot-title-with-help">Partial axes <span class="help-tooltip" tabindex="0" role="button" aria-label="Partial axes help" data-tooltip="Shows partial axis correlations from partial-correlations.tsv. Each vector uses the selected global MFA axes as coordinates, so vectors pointing in similar directions indicate agreement between groups and vectors near zero are weakly aligned with this view.">?</span></span>
        </div>
        <div id="partial-axes-plot" class="plot-canvas plot-canvas-secondary"></div>
      </div>
    </section>

    <section class="feature-table-shell" aria-label="Features">
      <div class="plot-status">
        <span class="plot-title-with-help">Features <span class="help-tooltip" tabindex="0" role="button" aria-label="Features help" data-tooltip="Ranks all features from the selected feature source by their magnitude in the currently selected two-dimensional MFA plane. Plane magnitude is calculated as sqrt(x^2 + y^2) from the selected X and Y axis values; larger values indicate features more strongly represented in this view.">?</span></span>
        <button id="download-feature-table" class="feature-table-download" type="button">Download tsv</button>
      </div>
      <div class="feature-table-wrapper">
        <table class="feature-table">
          <thead>
            <tr>
              <th>
                <button type="button" class="feature-table-sort" data-feature-sort="feature_name" data-default-direction="asc">
                  <span>Feature</span><span class="feature-table-sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
              <th>
                <button type="button" class="feature-table-sort" data-feature-sort="group" data-default-direction="asc">
                  <span>Group</span><span class="feature-table-sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
              <th>
                <button type="button" class="feature-table-sort" data-feature-sort="x" data-default-direction="desc">
                  <span id="feature-table-x-heading">X</span><span class="feature-table-sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
              <th>
                <button type="button" class="feature-table-sort" data-feature-sort="y" data-default-direction="desc">
                  <span id="feature-table-y-heading">Y</span><span class="feature-table-sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
              <th aria-sort="descending">
                <button type="button" class="feature-table-sort" data-feature-sort="rankingScore" data-default-direction="desc">
                  <span>Plane magnitude</span><span class="feature-table-sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
            </tr>
          </thead>
          <tbody id="top-features-table-body"></tbody>
        </table>
      </div>
      <div id="top-features-empty" class="feature-table-empty"></div>
      <div id="feature-name-tooltip" class="feature-name-tooltip" role="tooltip"></div>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
