<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MFA sample scores</title>
  <link rel="stylesheet" href="style.css">
  <script src="plotly-basic-2.35.2.min.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Q2-MFA</p>
        <h1 id="visualizer-title">MFA sample scores</h1>
      </div>
      <div class="theme-toggle-shell">
        <label class="theme-toggle" for="dark-mode-toggle">
          <span>Dark mode</span>
          <input id="dark-mode-toggle" type="checkbox">
        </label>
      </div>
    </header>

    <section class="control-panel" aria-label="Graph controls">
      <div class="control-group">
        <label for="x-dimension">X-axis</label>
        <select id="x-dimension"></select>
      </div>

      <div class="control-group">
        <label for="y-dimension">Y-axis</label>
        <select id="y-dimension"></select>
      </div>

      <div class="control-group">
        <label for="color-by">Color by metadata</label>
        <select id="color-by"></select>
      </div>

      <div class="control-group">
        <label for="color-palette">Color palette</label>
        <select id="color-palette"></select>
      </div>

      <div class="control-group control-group-toggle">
        <label class="toggle-option" for="show-barycenter">
          <input id="show-barycenter" type="checkbox">
          <span>Barycenter ellipse</span>
          <span class="help-tooltip" tabindex="0" role="button" aria-label="Barycenter ellipse help" data-tooltip="Shows an ellipse around the visible sample scores. It summarizes the center and spread of the currently displayed samples; wider ellipses indicate more dispersion on the selected MFA axes.">?</span>
        </label>
      </div>

      <div class="control-group control-group-toggle">
        <label class="toggle-option" for="show-partial-overlay">
          <input id="show-partial-overlay" type="checkbox">
          <span>Partial coordinates</span>
          <span class="help-tooltip" tabindex="0" role="button" aria-label="Partial coordinates help" data-tooltip="Shows each sample's group-specific partial coordinates and connects them to the global sample score. Long connectors indicate that a group places that sample away from the consensus position.">?</span>
        </label>
      </div>

      <div class="control-group control-group-toggle control-group-feature-correlations">
        <label class="toggle-option" for="show-feature-correlations">
          <input id="show-feature-correlations" type="checkbox">
          <span>Feature correlations</span>
          <span class="help-tooltip" tabindex="0" role="button" aria-label="Feature correlations help" data-tooltip="Overlays the strongest feature correlations for the selected axes. Arrows point toward samples associated with higher feature values; longer arrows mean stronger representation in this two-dimensional view. The top-feature count controls how many arrows are shown, ordered by two-dimensional correlation magnitude on the current X and Y axes.">?</span>
        </label>
      </div>

      <div class="control-group control-group-top-features">
        <label for="top-feature-count">Feature arrows</label>
        <input id="top-feature-count" type="number" min="1" max="100" step="1" value="10">
      </div>

      <div class="control-group">
        <label for="filter-by">Filter samples</label>
        <select id="filter-by"></select>
      </div>

      <div class="control-group control-group-wide">
        <div id="filter-controls" class="filter-controls"></div>
      </div>
    </section>

    <section class="plot-shell">
      <div class="plot-status">
        <span id="sample-count"></span>
        <span id="filter-summary"></span>
      </div>
      <div id="sample-plot" class="plot-canvas"></div>
    </section>

    <section class="plot-grid-secondary">
      <div class="plot-shell plot-shell-secondary">
        <div class="plot-status">
          <span class="plot-title-with-help">Explained variance by component <span class="help-tooltip" tabindex="0" role="button" aria-label="Explained variance help" data-tooltip="Shows how much total variation each MFA component explains. Larger bars indicate axes that capture more structure and are usually better candidates for interpretation.">?</span></span>
          <span id="variance-summary"></span>
        </div>
        <div id="variance-plot" class="plot-canvas plot-canvas-secondary"></div>
      </div>

      <div class="plot-shell plot-shell-secondary">
        <div class="plot-status">
          <span class="plot-title-with-help">Cumulative explained variance <span class="help-tooltip" tabindex="0" role="button" aria-label="Cumulative variance help" data-tooltip="Shows the running total of variance explained as components are added. Use it to judge how many axes are needed to summarize the dataset.">?</span></span>
          <span id="cumulative-summary"></span>
        </div>
        <div id="cumulative-variance-plot" class="plot-canvas plot-canvas-secondary"></div>
      </div>

      <div class="plot-shell plot-shell-secondary">
        <div class="plot-status">
          <span class="plot-title-with-help">Group partial inertia <span class="help-tooltip" tabindex="0" role="button" aria-label="Group partial inertia help" data-tooltip="Shows how strongly each data group contributes to and is represented by the selected MFA axes. Groups farther from zero are more influential in the displayed dimensions.">?</span></span>
        </div>
        <div id="group-plot" class="plot-canvas plot-canvas-secondary"></div>
      </div>

      <div class="plot-shell plot-shell-secondary">
        <div class="plot-status">
          <span class="plot-title-with-help">Partial axes <span class="help-tooltip" tabindex="0" role="button" aria-label="Partial axes help" data-tooltip="Shows how each group-specific axis aligns with the global MFA axes. Vectors pointing in similar directions indicate agreement between groups; vectors near zero are weakly aligned with this view.">?</span></span>
        </div>
        <div id="partial-axes-plot" class="plot-canvas plot-canvas-secondary"></div>
      </div>
    </section>

    <section class="feature-table-shell" aria-label="Contributing features">
      <div class="plot-status">
        <span class="plot-title-with-help">Contributing features <span class="help-tooltip" tabindex="0" role="button" aria-label="Contributing features help" data-tooltip="Ranks all features by the magnitude of their correlations in the currently selected two-dimensional MFA plane. Larger values indicate features more strongly represented by the selected axes.">?</span></span>
        <button id="download-feature-table" class="feature-table-download" type="button">Download TSV</button>
      </div>
      <div class="feature-table-wrapper">
        <table class="feature-table">
          <thead>
            <tr>
              <th aria-sort="ascending">
                <button type="button" class="feature-table-sort" data-feature-sort="rank" data-default-direction="asc">
                  <span>Rank</span><span class="feature-table-sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
              <th>
                <button type="button" class="feature-table-sort" data-feature-sort="feature_name" data-default-direction="asc">
                  <span>Feature</span><span class="feature-table-sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
              <th>
                <button type="button" class="feature-table-sort" data-feature-sort="group" data-default-direction="asc">
                  <span>Group</span><span class="feature-table-sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
              <th>
                <button type="button" class="feature-table-sort" data-feature-sort="x" data-default-direction="desc">
                  <span id="feature-table-x-heading">X</span><span class="feature-table-sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
              <th>
                <button type="button" class="feature-table-sort" data-feature-sort="y" data-default-direction="desc">
                  <span id="feature-table-y-heading">Y</span><span class="feature-table-sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
              <th>
                <button type="button" class="feature-table-sort" data-feature-sort="rankingScore" data-default-direction="desc">
                  <span>Plane magnitude</span><span class="feature-table-sort-indicator" aria-hidden="true"></span>
                </button>
              </th>
            </tr>
          </thead>
          <tbody id="top-features-table-body"></tbody>
        </table>
      </div>
      <div id="top-features-empty" class="feature-table-empty"></div>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
